name: influbid

services:
  traefik:
    image: traefik:v3.3
    container_name: influbid-traefik
    restart: unless-stopped
    command:
      - --configFile=/etc/traefik/traefik.yml
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_certs:/letsencrypt
      - ./deploy/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
    networks:
      - web

  postgres:
    image: postgres:16-alpine
    container_name: influbid-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-supastarter}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  minio:
    image: minio/minio:latest
    container_name: influbid-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - internal

  minio-setup:
    image: minio/mc:latest
    container_name: influbid-minio-setup
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD};
      mc mb local/${NEXT_PUBLIC_AVATARS_BUCKET_NAME:-avatars} --ignore-existing;
      mc anonymous set download local/${NEXT_PUBLIC_AVATARS_BUCKET_NAME:-avatars};
      echo 'Bucket setup complete';
      exit 0;
      "
    networks:
      - internal

  saas:
    image: ghcr.io/${GHCR_OWNER:-iamreda}/influbid-saas:latest
    container_name: influbid-saas
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    depends_on:
      postgres:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    labels:
      - traefik.enable=true
      - traefik.docker.network=influbid_web
      - traefik.http.routers.saas.rule=Host(`${DOMAIN_SAAS}`)
      - traefik.http.routers.saas.entrypoints=websecure
      - traefik.http.routers.saas.tls=true
      - traefik.http.routers.saas.tls.certresolver=letsencrypt
      - traefik.http.services.saas.loadbalancer.server.port=3000
    networks:
      - web
      - internal

  marketing:
    image: ghcr.io/${GHCR_OWNER:-iamreda}/influbid-marketing:latest
    container_name: influbid-marketing
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3001"
      HOSTNAME: "0.0.0.0"
    depends_on:
      postgres:
        condition: service_healthy
      saas:
        condition: service_started
    labels:
      - traefik.enable=true
      - traefik.docker.network=influbid_web
      - traefik.http.routers.marketing.rule=Host(`${DOMAIN_MARKETING}`)
      - traefik.http.routers.marketing.entrypoints=websecure
      - traefik.http.routers.marketing.tls=true
      - traefik.http.routers.marketing.tls.certresolver=letsencrypt
      - traefik.http.services.marketing.loadbalancer.server.port=3001
    networks:
      - web
      - internal

  migrate:
    image: ghcr.io/${GHCR_OWNER:-iamreda}/influbid-migrate:latest
    container_name: influbid-migrate
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    profiles:
      - tools
    restart: "no"

networks:
  web:
    name: influbid_web
  internal:
    name: influbid_internal

volumes:
  postgres_data:
  minio_data:
  traefik_certs:
