name: Build & Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  GHCR_OWNER: iamreda

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    environment: prod
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: saas
            target: runner
            image: influbid-saas
          - app: marketing
            target: runner
            image: influbid-marketing
          - app: migrate
            target: migrator
            image: influbid-migrate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.GHCR_OWNER }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_NAME=${{ matrix.app == 'migrate' && 'saas' || matrix.app }}
            NEXT_PUBLIC_SAAS_URL=${{ secrets.NEXT_PUBLIC_SAAS_URL }}
            NEXT_PUBLIC_MARKETING_URL=${{ secrets.NEXT_PUBLIC_MARKETING_URL }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    environment: prod
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Render production .env from PRODUCTION_ENV secret
        env:
          PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}
          NEXT_PUBLIC_SAAS_URL: ${{ secrets.NEXT_PUBLIC_SAAS_URL }}
          NEXT_PUBLIC_MARKETING_URL: ${{ secrets.NEXT_PUBLIC_MARKETING_URL }}
          GHCR_OWNER: ${{ env.GHCR_OWNER }}
        run: |
          if [ -z "$PRODUCTION_ENV" ]; then
            echo "PRODUCTION_ENV secret is required" >&2
            exit 1
          fi
          umask 077
          bash deploy/append-production-env.sh > .env.production
          # scp-action runs in a separate container and must be able to read
          # the bind-mounted file. It is restored to 600 on the VPS.
          chmod 644 .env.production

      - name: Copy compose file and .env to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_SSH_PORT != '' && secrets.VPS_SSH_PORT || 22 }}
          source: "docker-compose.prod.yml,deploy/nginx/creatorland.conf,.env.production"
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_SSH_PORT != '' && secrets.VPS_SSH_PORT || 22 }}
          envs: GHCR_TOKEN,GHCR_USER
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            mv -f .env.production .env
            chmod 600 .env
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker compose -f docker-compose.prod.yml --profile tools run --rm migrate
            docker image prune -f
            DOMAIN_SAAS=$(grep -E '^DOMAIN_SAAS=' .env | cut -d= -f2- | tr -d "\"'")
            if [ -n "$DOMAIN_SAAS" ]; then
              for attempt in 1 2 3 4 5 6; do
                if curl -sf "https://${DOMAIN_SAAS}/api/health"; then
                  exit 0
                fi
                sleep 10
              done
              echo "SaaS health check failed after 60 seconds" >&2
              docker compose -f docker-compose.prod.yml ps
              docker compose -f docker-compose.prod.yml logs --tail=100 saas
              exit 1
            fi
